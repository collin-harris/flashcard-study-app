name: CI

# Every push and every pull request, on any branch
on:
  push:
  pull_request:

# The jobs only read the code
permissions:
  contents: read

# No real secrets are used. The database credentials and SECRET_KEY below are
# throwaway values for CI only. The workflow references no repository
# secrets and never sets ANTHROPIC_API_KEY, so no test can reach the
# Anthropic API; the Python jobs check this before running.

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    # The same database docker-compose.test.yml sets up: Postgres 15 with a
    # disposable flashcard_test_db, used only by this job
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: flashcard_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d flashcard_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/flashcard_test_db
      # Long enough to pass the backend's startup check; used nowhere else
      SECRET_KEY: ci-only-secret-key-never-used-outside-github-actions

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      # The Docker image's Python version (python:3.11-slim)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Check that no Anthropic credentials are set
        run: |
          if [ -n "${ANTHROPIC_API_KEY:-}${ANTHROPIC_AUTH_TOKEN:-}" ]; then
            echo "::error::An Anthropic credential is set. Tests must not be able to reach the Anthropic API."
            exit 1
          fi

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Run pytest
        run: pytest

  frontend:
    name: Frontend tests, lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      # The Node version used for local development
      - uses: actions/setup-node@v7
        with:
          node-version: "24.17.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  eval:
    name: Eval unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The local .venv's Python version
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            eval/requirements.txt
            backend/requirements.txt

      - name: Check that no Anthropic credentials are set
        run: |
          if [ -n "${ANTHROPIC_API_KEY:-}${ANTHROPIC_AUTH_TOKEN:-}" ]; then
            echo "::error::An Anthropic credential is set. Tests must not be able to reach the Anthropic API."
            exit 1
          fi

      # The same requirements the local .venv has: the backend's plus
      # python-dotenv. Run from the repository root, as locally.
      - name: Install dependencies
        run: pip install -r eval/requirements.txt

      - name: Run the eval unit tests
        run: python -m unittest discover -s eval/tests
