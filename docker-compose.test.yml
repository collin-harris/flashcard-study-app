services:
  db_test:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: flashcard_test_db
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "flashcard_test_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      target: test
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db_test:5432/flashcard_test_db
      # A fixed key for the test suite only, so tests never depend on the
      # developer's .env. Long enough to pass the backend's startup check.
      SECRET_KEY: test-only-secret-key-never-used-outside-the-test-suite
    depends_on:
      db_test:
        condition: service_healthy
